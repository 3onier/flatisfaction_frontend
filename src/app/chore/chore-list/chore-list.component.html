<ion-header>
  <ion-toolbar>
    <ion-menu-button slot="start"></ion-menu-button>
    <ion-title>Chores</ion-title>
    <ion-progress-bar type="indeterminate" *ngIf="isLoading"></ion-progress-bar>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list inset="true">
    <ion-list-header>
      <ion-label>List of chores in this flat</ion-label>
      <ion-button routerLink="/chore/detail">
        create
      </ion-button>
    </ion-list-header>
    @if(isLoading){
      <ion-item>
        <ion-label>
          <h2><ion-skeleton-text animated="true" style="width: 80%;"></ion-skeleton-text></h2>
          <p><ion-skeleton-text animated="true" style="width: 60%;"></ion-skeleton-text></p>
          <p><ion-skeleton-text animated="true" style="width: 50%;"></ion-skeleton-text></p>
        </ion-label>
      </ion-item>
    }@else{
      <ion-item button *ngFor="let chore of chores" routerLink="/chore/detail/{{chore.id}}">
        <ion-label>
          <strong>{{ chore.name }}</strong><br>
          <ion-text>{{ chore.description }}</ion-text>
        </ion-label>
        <ion-icon color="medium" name="chevron-forward"></ion-icon>
      </ion-item>
    }
  </ion-list>
</ion-content>
