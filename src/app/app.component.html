<ion-app>
  <ion-split-pane when="lg" contentId="main">
    <ion-menu contentId="main">
      <ion-header>
        <ion-toolbar>
          <ion-title>Menu</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
         <ion-list lines="none">
            <ion-item button [routerLink]="['/']">
              <ion-icon name="home" slot="start"></ion-icon>
              <ion-label>
                Home
              </ion-label>
            </ion-item>
         </ion-list>
          <ion-list lines="none">
            <ion-list-header>
              Me
            </ion-list-header>
            <ion-item button [routerLink]="['/user/profile']">
              <ion-icon name="person" slot="start"></ion-icon>
              <ion-label>
                My Profile
              </ion-label>
            </ion-item>

            <ion-list-header>
              <ion-label>Flat</ion-label>
              <ion-button color="success" [routerLink]="['/flat/create']">
                <ion-icon icon="add"></ion-icon>
              </ion-button>
            </ion-list-header>
            <app-flat-selection></app-flat-selection>
            <ion-item button [routerLink]="['/flat/detail']">
              <ion-icon icon="hammer" slot="start"></ion-icon>
              <ion-label>Flat Settings</ion-label>
            </ion-item>
            <ion-list-header>
              <ion-label>Chores</ion-label>
            </ion-list-header>
            <ion-item  button [routerLink]="['/chore/calendar']">
              <ion-icon slot="start" name="calendar"></ion-icon>
              <ion-label>Chore Calendar</ion-label>
            </ion-item>
            <ion-item button [routerLink]="['/chore/list']">
              <ion-icon slot="start" icon="rocket"></ion-icon>
              <ion-label>Chore List</ion-label>
            </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <div class="ion-page" id="main">
      <ion-router-outlet id="main-content"></ion-router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
