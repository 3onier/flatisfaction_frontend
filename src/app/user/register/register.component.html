<ion-card>
  <ion-card-header>
    <ion-card-title>
      Sign up
    </ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-list>
      <ion-item>
        <ion-input label="Username" placeholder="Username"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="E-mail" placeholder="E-Mail"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Password" type="password" placeholder="Password"></ion-input>
      </ion-item>
    </ion-list>
    <ion-note><a routerLink="/user/login">I already have an account</a></ion-note>
  </ion-card-content>
  <ion-button fill="clear">Sign up</ion-button>
</ion-card>
