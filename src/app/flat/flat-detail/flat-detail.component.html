<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Flat Settings</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-accordion-group expand="inset" value="ion-accordion-0">
    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-icon name="home" slot="start"></ion-icon>
        <ion-label>General</ion-label>
      </ion-item>
      <div slot="content">
        <ion-list>
          <ion-item>
            <ion-input 
              [(ngModel)]="flat.name"
              label="Flat Name"
              [readonly]="!isAdmin"
            ></ion-input>
          </ion-item>
          <div class="ion-padding" *ngIf="isAdmin">
            <ion-button (click)="updateFlat()">save</ion-button>
          </div>
        </ion-list>
      </div>
    </ion-accordion>

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-icon name="person" slot="start"></ion-icon>
        <ion-label>Members</ion-label>
      </ion-item>
      <div slot="content">
        <ion-list lines="full">
          <ion-item-sliding *ngFor="let user of flatMembersShown">
            <ion-item>
              <ion-icon icon="person" slot="start"></ion-icon>
              <ion-label>{{ user.username }}</ion-label>
            </ion-item>
            <ion-item-options *ngIf="isAdmin">
              <ion-item-option color="danger" (click)="removeMember(user.id)">
                remove
              </ion-item-option>
              <ion-item-option color="success" (click)="makeAdmin(user.id)">
                make admin
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        </ion-list>
      </div>
    </ion-accordion>    

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-icon name="clipboard" slot="start"></ion-icon>
        <ion-label>Admins</ion-label>
      </ion-item>
      <div slot="content">
        <ion-list>
          <ion-item-sliding *ngFor="let user of flatAdmins">
            <ion-item>
              <ion-icon icon="person" slot="start"></ion-icon>
              <ion-label>{{ user.username }}</ion-label>
            </ion-item>
            <ion-item-options *ngIf="isAdmin">
              <ion-item-option color="danger" (click)="revokeAdmin(user.id)">
                revoke admin
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        </ion-list>
      </div>
    </ion-accordion> 

    <ion-accordion *ngIf="isAdmin">
      <ion-item slot="header" color="light">
        <ion-icon slot="start" icon="enter"></ion-icon>
        <ion-label>Invites</ion-label>
      </ion-item>
      <app-invite-list slot="content"></app-invite-list>
    </ion-accordion>

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-icon slot="start" icon="warning"></ion-icon>
        <ion-label>Danger zone</ion-label>
      </ion-item>
      <ion-list slot="content">
        <ion-button class="ion-margin" expand="block" color="danger" (click)="setleaveAlertOpen(true)">
          <ion-icon slot="start" icon="exit-outline"></ion-icon>
          Leave
        </ion-button>
        <!--<ion-button class="ion-margin" expand="block" color="danger" (click)="setleaveAlertOpen(true)">
          <ion-icon slot="start" icon="trash-outline"></ion-icon>
          Delete flat
        </ion-button>-->
      </ion-list>
    </ion-accordion>

  </ion-accordion-group>

  <ion-alert
    [isOpen]="isleaveAlertOpen"
    header="Do you really want to leave the flat?"
    message="You cannot join the flat again unless you are being invited"
    [buttons]="leaveAlertButtons"
    (didDismiss)="setleaveAlertOpen(false)"
  ></ion-alert>

  <ion-toast
    message="Saved"
    [isOpen]="showSuccessToast"
    duration="5000"
    color="success"
    swipeGesture="vertical"
    (didDismiss)="showSuccessToast = false"
  ></ion-toast>
</ion-content>
