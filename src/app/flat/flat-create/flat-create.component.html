<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Create Flat</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="ion-margin">
    <h1>Welcome to Flatisfaction</h1>
    <p>Create your flat or join an flat by asking your flatmates for an invite link</p>
  </div>
  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Data for your flat</ion-label>
    </ion-list-header>
    <ion-item>
      <ion-input
        label="Flat Name"
        [(ngModel)]="flat.name"
      ></ion-input>
    </ion-item>
    <div class="ion-margin-start ion-margin-top">
      <ion-button color="success" (click)="createFlat()">Create</ion-button>
    </div>
  </ion-list>
</ion-content>
